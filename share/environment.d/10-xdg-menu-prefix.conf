# See ~/.config/niri/config.d/40-environment.kdl for why this is required.
# Also needed here so D-Bus/systemd-activated KDE services (kded6, kiod6,
# xdg-desktop-portal-kde) inherit it — otherwise one of them can rebuild the
# ksycoca index without the prefix and wipe every application entry again.
XDG_MENU_PREFIX=plasma-
