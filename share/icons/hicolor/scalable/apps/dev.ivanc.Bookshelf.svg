<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Bookshelf</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E2E"/>
      <stop offset="1" stop-color="#0C0D14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E4A8"/>
      <stop offset="1" stop-color="#D9C079"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#ground)"/>

  <!-- the shelf itself: a hairline board the spines stand on -->
  <rect x="26" y="92" width="76" height="4" rx="2" fill="#39405C"/>

  <!-- spines, upright, one of them pulled slightly proud of the row -->
  <g>
    <rect x="28" y="42" width="13" height="50" rx="2" fill="#262A3D" stroke="#39405C"/>
    <rect x="44" y="34" width="13" height="58" rx="2" fill="#1E2130" stroke="#39405C"/>
    <rect x="60" y="38" width="13" height="54" rx="2" fill="url(#accent)"/>
    <rect x="76" y="30" width="13" height="62" rx="2" fill="#262A3D" stroke="#39405C"/>
  </g>

  <!-- a volume laid flat on top of the standing ones -->
  <rect x="60" y="22" width="42" height="9" rx="2" fill="#1E2130" stroke="#39405C"
        transform="rotate(-8 81 26)"/>

  <!-- title bands on the accent spine, the way a real spine carries lettering -->
  <g fill="#14151F" opacity="0.75">
    <rect x="63" y="47" width="7" height="2.6" rx="1.3"/>
    <rect x="63" y="53" width="7" height="2.6" rx="1.3"/>
  </g>
</svg>
