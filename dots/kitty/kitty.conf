# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (consistency with foot).
#
# padding, NOT margin. kitty's man page: padding is the "blank area between the
# text and the window border" and is filled with the terminal background, so it
# inherits background_opacity. margin is the "blank area outside the border" —
# it is not painted at all, so the wallpaper showed through it at full
# brightness while the text area sat behind 0.85 opacity. The hard vertical
# seam between the two is what looked like a window split into halves.
# A non-zero margin also forces kitty to draw window borders.
window_padding_width 21.75

# Transparency
background_opacity 0.85

# No close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Colours, regenerated by noctalia on every wallpaper change. Its apply.sh
# appends exactly this line if it is missing, so keep the text verbatim —
# otherwise it rewrites kitty.conf, which is a symlink into the git repo.
# themes/ is a real directory under ~/.config/kitty, not part of the repo.
include themes/noctalia.conf

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
