config_version = 8

# Telegram Desktop has no template of its own: it wants a zipped .tdesktop-theme
# with the wallpaper inside, so bin/noctalia-telegram-theme builds one instead.
# Both events fire on a wallpaper change; the script takes a lock and the second
# run exits immediately.
[hooks]
colors_changed = [ "~/.local/bin/noctalia-telegram-theme" ]
wallpaper_changed = [ "~/.local/bin/noctalia-telegram-theme" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 1001.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
telemetry_enabled = true

[theme]
# The palette follows the wallpaper, but light/dark does not: pinned here so a
# bright wallpaper cannot flip the whole shell to a light scheme.
#
# Worth knowing when this looks like it is being ignored: favourited wallpapers
# carry their own theme_mode, and that overrides this one. Those live in the
# runtime settings.toml (they are per-machine, so not carried here) — check
# `noctalia msg theme-mode-get` for what actually resolved, since the value
# below can read "dark" while a favourite forces light.
mode = "dark"
# source/wallpaper_scheme match noctalia's own defaults; spelled out so the
# palette-follows-wallpaper behaviour is visible here rather than implied.
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    # Templates noctalia re-renders on every palette change. Each id maps to
    # /usr/share/noctalia/assets/templates/<id>/, whose apply.sh also reloads
    # the running app — kitty's sends SIGUSR1.
    #
    # "neovim" is a community template — noctalia downloads it into
    # ~/.local/state/noctalia/community-templates on first use. It renders
    # ~/.config/nvim/lua/matugen.lua and signals nvim with SIGUSR1; the nvim
    # side of that lives in the LVim repo (lua/plugins/base16.lua), which this
    # repo only clones, so it has to be committed there separately.
    [theme.templates]
    # "kcolorscheme" writes ~/.local/share/color-schemes/noctalia.colors and
    # applies it, which is where Dolphin and every other KDE app take their
    # colours from under QT_QPA_PLATFORMTHEME "kde". iNiR generated a static
    # kdeglobals with matugen for this; here the palette follows the wallpaper
    # like everything else, so that file is deliberately not carried over.
    builtin_ids = [ "kitty", "kcolorscheme" ]
    community_ids = [ "neovim" ]

[wallpaper.default]
path = "/home/ivanc/Pictures/Wallpapers/konachan-398920.jpg"

[wallpaper.last]
path = "/home/ivanc/Pictures/Wallpapers/konachan-398920.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/ivanc/Pictures/Wallpapers/konachan-398920.jpg"