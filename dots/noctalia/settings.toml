config_version = 8

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 1001.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
telemetry_enabled = true

[theme]
# source/wallpaper_scheme match noctalia's own defaults; spelled out so the
# palette-follows-wallpaper behaviour is visible here rather than implied.
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    # Templates noctalia re-renders on every palette change. Each id maps to
    # /usr/share/noctalia/assets/templates/<id>/, whose apply.sh also reloads
    # the running app — kitty's sends SIGUSR1.
    #
    # "neovim" is a community template — noctalia downloads it into
    # ~/.local/state/noctalia/community-templates on first use. It renders
    # ~/.config/nvim/lua/matugen.lua and signals nvim with SIGUSR1; the nvim
    # side of that lives in the LVim repo (lua/plugins/base16.lua), which this
    # repo only clones, so it has to be committed there separately.
    [theme.templates]
    builtin_ids = [ "kitty" ]
    community_ids = [ "neovim" ]

[wallpaper.default]
path = "/home/ivanc/Pictures/Wallpapers/random_wallpaper-1.png"

[wallpaper.last]
path = "/home/ivanc/Pictures/Wallpapers/random_wallpaper-1.png"

[wallpaper.monitors.eDP-1]
path = "/home/ivanc/Pictures/Wallpapers/random_wallpaper-1.png"